name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Unit tests
        run: dotnet test --no-build -c Release --filter "FullyQualifiedName!~IngestionEndpointTests"

      - name: Integration tests
        run: dotnet test --no-build -c Release --filter "FullyQualifiedName~IngestionEndpointTests"

      - name: Dependency vulnerability check
        run: |
          echo "Scanning for vulnerable packages (including transitive)…"
          output=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable"; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi
