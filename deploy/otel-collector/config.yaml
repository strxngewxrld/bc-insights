# OpenTelemetry Collector configuration for the Business Central telemetry proxy.
#
# OPTIONAL. The proxy exports directly to the backend by default. Use this
# Collector only to add Windows Event Logs or fan out to several backends; then
# point the proxy's Otlp:Endpoint at http://localhost:4318.
#
# It receives translated telemetry from the proxy over OTLP, reads selected
# Windows Event Log providers, and forwards everything to an OTLP-capable
# backend. Requires the *contrib* distribution (otelcol-contrib) for the
# windowseventlog receiver. Set OTLP_EXPORT_ENDPOINT before starting the service.

receivers:
  # Telemetry translated by the BC proxy.
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317

  # Windows Event Log -> OTLP logs. Scoped to providers relevant to this use case
  # instead of shipping the whole System/Application channels. Narrow further with
  # explicit event ids via the query attribute if needed.
  windowseventlog/application:
    channel: Application
    # Only events from BC-relevant providers.
    query: |
      *[System[Provider[
        @Name='Microsoft Dynamics 365 Business Central Server' or
        @Name='.NET Runtime' or
        @Name='IIS AspNetCore Module V2' or
        @Name='BcTelemetryProxy'
      ]]]
  windowseventlog/system:
    channel: System
    # System channel restricted to warnings and errors (Level 1=Critical..3=Warning).
    query: |
      *[System[(Level=1 or Level=2 or Level=3)]]

processors:
  batch:
    timeout: 5s
    send_batch_size: 8192
    send_batch_max_size: 16384
  resource:
    attributes:
      - key: service.namespace
        value: dynamics365-bc
        action: upsert

exporters:
  # Backend-neutral OTLP/HTTP exporter. Point OTLP_EXPORT_ENDPOINT at any
  # OTLP-capable backend (GitLab Observability, Grafana/Tempo/Loki, Jaeger,
  # a vendor endpoint, ...). See docs/deployment.md for backend examples.
  otlphttp/backend:
    endpoint: ${env:OTLP_EXPORT_ENDPOINT}
    # Secure by default: TLS verification stays on. For a token-authenticated
    # backend, add the header it expects, e.g.:
    # headers:
    #   Authorization: ${env:OTLP_EXPORT_TOKEN}
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000

  # Handy while validating locally: prints exported telemetry to the console.
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/backend]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/backend]
    logs:
      receivers: [otlp, windowseventlog/application, windowseventlog/system]
      processors: [resource, batch]
      exporters: [otlphttp/backend]
